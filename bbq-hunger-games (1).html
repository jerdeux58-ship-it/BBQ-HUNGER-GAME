<style>
* { box-sizing: border-box; }
.app-shell {
  position: relative;
  min-height: 100vh;
  background: radial-gradient(ellipse at 50% -10%, #5a3a24 0%, #3a2718 55%, #2a1c12 100%);
  color: #F2E8DC;
  font-family: 'Inter', -apple-system, sans-serif;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
}
.ember-field { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
.logo-watermark { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 0; overflow: hidden; }
.logo-watermark img { width: min(150vw, 860px); max-width: none; opacity: 0.26; filter: saturate(1.1); }
.ember {
  position: absolute; bottom: -10px; width: 4px; height: 4px; border-radius: 50%;
  background: radial-gradient(circle, #FFB627, #FF6B35 60%, transparent 70%);
  animation-name: float-up; animation-timing-function: ease-in; animation-iteration-count: infinite;
}
@keyframes float-up {
  0% { transform: translateY(0) translateX(0); opacity: 0; }
  10% { opacity: 1; }
  100% { transform: translateY(-100vh) translateX(20px); opacity: 0; }
}
.topbar {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 8px;
  padding: 14px 18px; background: rgba(42,28,18,0.85); backdrop-filter: blur(8px);
  border-bottom: 1px solid rgba(255,107,53,0.2);
}
.topbar-side { flex: 1; display: flex; align-items: center; }
.topbar-side-right { justify-content: flex-end; }
.topbar-title { font-family: 'Arial Black', sans-serif; letter-spacing: 1px; font-size: 14px; font-weight: 900; color: #FFD9A8; }
.org-chip { font-size: 10px; font-weight: 800; background: #FF6B35; color: #150e0a; padding: 3px 8px; border-radius: 20px; letter-spacing: 0.5px; }
.content { flex: 1; padding: 16px 16px 90px; position: relative; z-index: 1; max-width: 480px; margin: 0 auto; width: 100%; }
.screen { display: flex; flex-direction: column; gap: 14px; }

.brand { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; padding: 30px 4px 10px; }
.brand-title { font-family: 'Arial Black', sans-serif; font-size: 22px; font-weight: 900; letter-spacing: 0.5px; color: #FFD9A8; margin-top: 6px; }
.brand-sub { font-size: 13px; color: #C9A98A; margin-top: 2px; }
.reclaim-card { border-color: rgba(79,195,232,0.3); }
.reclaim-list { display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto; }
.reclaim-row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 10px; background: rgba(0,0,0,0.2); border: none; color: inherit; font-family: inherit; text-align: left; }
.reclaim-name { flex: 1; font-size: 13px; font-weight: 600; }
.reclaim-arrow { color: #4FC3E8; font-size: 16px; font-weight: 800; }

.card {
  background: linear-gradient(155deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
  border: 1px solid rgba(255,178,39,0.15);
  border-radius: 16px; padding: 16px;
}
.field-label { font-size: 12px; color: #C9A98A; margin: 10px 0 6px; font-weight: 600; }
.input {
  width: 100%; padding: 11px 13px; border-radius: 10px; border: 1px solid rgba(255,178,39,0.25);
  background: rgba(0,0,0,0.25); color: #F2E8DC; font-size: 14px; margin-bottom: 4px;
}
.input:focus { outline: none; border-color: #FF6B35; }
.avatar-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 6px; }
.photo-picker-row { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
.photo-preview { width: 56px; height: 56px; border-radius: 50%; background: rgba(0,0,0,0.25); border: 1px dashed rgba(255,178,39,0.35); display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; overflow: hidden; }
.photo-preview.active { border-style: solid; border-color: #FFB627; }
.photo-picker-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.photo-upload-btn { display: inline-flex; align-items: center; justify-content: center; width: auto; padding: 9px 14px; font-size: 12px; }
.avatar-pick { font-size: 20px; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,178,39,0.2); border-radius: 10px; padding: 8px 0; display: flex; align-items: center; justify-content: center; }
.avatar-pick.active { border-color: #FF6B35; background: rgba(255,107,53,0.2); }
.organizer-toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #C9A98A; margin: 14px 0 4px; }

.btn-primary {
  width: 100%; margin-top: 14px; padding: 13px; border: none; border-radius: 12px;
  background: linear-gradient(135deg, #FF6B35, #C1121F); color: #fff; font-weight: 800; font-size: 14px;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  box-shadow: 0 4px 20px rgba(255,107,53,0.35);
}
.btn-primary:disabled { opacity: 0.4; }
.btn-secondary {
  width: 100%; margin-top: 8px; padding: 11px; border-radius: 10px; border: 1px solid rgba(255,178,39,0.3);
  background: rgba(255,178,39,0.08); color: #FFD9A8; font-weight: 700; font-size: 13px;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.btn-secondary.danger { border-color: rgba(220,60,60,0.4); background: rgba(220,60,60,0.1); color: #FF9A9A; }
.btn-row { display: flex; gap: 8px; }
.btn-row .btn-secondary { margin-top: 8px; }
.btn-mini { padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(220,60,60,0.4); background: rgba(220,60,60,0.12); color: #FF9A9A; font-size: 12px; font-weight: 700; margin-left: auto; }
.interval-row { display: flex; gap: 8px; flex-wrap: wrap; }
.interval-btn { margin-left: 0; border-color: rgba(255,178,39,0.3) !important; background: rgba(255,178,39,0.1) !important; color: #FFD9A8 !important; }
.autobell-status { font-size: 13px; font-weight: 800; color: #7FD858; margin-bottom: 8px; }
.icon-btn { width: 34px; height: 34px; border-radius: 10px; border: 1px solid rgba(255,178,39,0.3); background: rgba(0,0,0,0.25); color: #FFD9A8; display: flex; align-items: center; justify-content: center; }
.points-row { display: flex; align-items: center; gap: 12px; justify-content: center; margin: 10px 0; }
.points-amount { font-size: 18px; font-weight: 800; color: #FFD9A8; min-width: 64px; text-align: center; }

.hero { text-align: center; padding: 20px 0 4px; }
.hero-level-label { font-size: 12px; letter-spacing: 3px; color: #C9A98A; font-weight: 700; }
.hero-level { font-family: 'Arial Black', sans-serif; font-size: 64px; font-weight: 900; color: #FFB627; line-height: 1; text-shadow: 0 0 30px rgba(255,107,53,0.5); }
.hero-level-max { font-size: 28px; color: #8a6e55; }
.hero-status { margin-top: 8px; font-size: 12px; font-weight: 700; letter-spacing: 0.5px; }
.hero-status.live { color: #7FD858; display: flex; align-items: center; justify-content: center; gap: 6px; }
.hero-status.finished { color: #FFB627; }
.hero-status.waiting { color: #C9A98A; }
.next-bell { margin-top: 10px; font-size: 12px; font-weight: 700; color: #FFB627; }
.notif-banner { display: flex; flex-direction: column; gap: 4px; text-align: center; }
.notif-text { font-size: 12px; color: #C9A98A; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: #7FD858; box-shadow: 0 0 8px #7FD858; animation: pulse 1.4s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

.event-card { background: linear-gradient(135deg, rgba(220,60,60,0.18), rgba(255,107,53,0.1)); border: 1px solid rgba(255,107,53,0.4); border-radius: 16px; padding: 18px; text-align: center; }
.event-emoji { font-size: 32px; }
.event-titre { font-weight: 900; font-size: 16px; color: #FFD9A8; margin: 6px 0 4px; letter-spacing: 0.5px; }
.event-texte { font-size: 13px; color: #E6D4C0; }

.epreuve-card { text-align: center; }
.epreuve-cat { font-size: 12px; font-weight: 800; letter-spacing: 0.5px; margin-bottom: 4px; }
.epreuve-titre { font-size: 18px; font-weight: 800; color: #FFD9A8; }
.epreuve-winners { margin-top: 8px; font-size: 13px; font-weight: 700; color: #FFB627; }
.epreuve-surprise { background: linear-gradient(135deg, rgba(255,178,39,0.12), rgba(255,107,53,0.06)); border-style: dashed; }
.epreuve-surprise-emoji { font-size: 30px; margin-bottom: 4px; }

.section-title { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; color: #C9A98A; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
.section-title.big { font-size: 16px; color: #FFD9A8; }

.leaderboard { display: flex; flex-direction: column; gap: 6px; }
.lb-row { display: flex; align-items: center; gap: 10px; padding: 8px 6px; border-radius: 10px; width: 100%; background: none; border: none; color: inherit; font-family: inherit; text-align: left; cursor: pointer; }
.lb-row.me { background: rgba(255,178,39,0.12); }
.lb-row.eliminated { opacity: 0.5; }
.lb-rank { width: 22px; text-align: center; font-size: 15px; }
.lb-name { flex: 1; font-size: 14px; font-weight: 600; }
.lb-points { font-size: 13px; font-weight: 800; color: #FFB627; }
.avatar { border-radius: 50%; background: rgba(255,178,39,0.12); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

.pbar-row { margin-bottom: 8px; }
.pbar-label { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #C9A98A; margin-bottom: 3px; }
.pbar-track { height: 7px; border-radius: 5px; background: rgba(0,0,0,0.3); overflow: hidden; }
.pbar-fill { height: 100%; border-radius: 5px; transition: width 0.4s; }
.note { font-size: 11px; color: #8a6e55; margin-top: 6px; font-style: italic; }
.empty-note { font-size: 13px; color: #8a6e55; text-align: center; padding: 10px 0; }
.eliminated-note { text-align: center; font-size: 13px; color: #FF9A9A; }

.profil-card { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 24px 16px; }
.profil-name { font-size: 20px; font-weight: 900; margin-top: 10px; color: #FFD9A8; }
.profil-rank { font-size: 12px; color: #7FD858; font-weight: 700; margin-top: 2px; }
.profil-stats { display: flex; gap: 20px; margin-top: 16px; }
.stat { text-align: center; }
.stat-val { font-size: 20px; font-weight: 900; color: #FFB627; }
.stat-label { font-size: 10px; color: #C9A98A; margin-top: 2px; }
.profil-line { font-size: 12px; color: #C9A98A; margin-top: 10px; }
.profil-teaser { margin-top: 14px; font-size: 13px; font-style: italic; color: #FFD9A8; line-height: 1.5; padding: 12px 14px; background: rgba(255,178,39,0.08); border-left: 3px solid #FF6B35; border-radius: 6px; text-align: left; align-self: stretch; }
.teaser-edit-link { margin-top: 10px; background: none; border: none; color: #FFB627; font-size: 12px; font-weight: 700; text-decoration: underline; }
.teaser-edit { margin-top: 14px; width: 100%; text-align: left; align-self: stretch; }
.teaser-input { resize: vertical; font-family: inherit; }
.badge-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.badge-chip { font-size: 12px; background: rgba(255,178,39,0.12); border: 1px solid rgba(255,178,39,0.25); padding: 6px 10px; border-radius: 20px; font-weight: 700; color: #FFD9A8; }

.elim-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 13px; }
.bareme-grid { display: flex; flex-direction: column; gap: 8px; }
.bareme-row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 700; gap: 10px; }
.bareme-input { width: 72px; margin-bottom: 0; padding: 8px 10px; text-align: center; flex-shrink: 0; }
.winner-check { display: flex; align-items: center; gap: 8px; padding: 7px 0; font-size: 13px; }
.winner-check input { width: 16px; height: 16px; accent-color: #FF6B35; }
.plan-list { display: flex; flex-direction: column; gap: 6px; max-height: 340px; overflow-y: auto; margin-bottom: 10px; padding-right: 2px; }
.plan-row { display: flex; align-items: center; gap: 6px; }
.plan-level { width: 38px; flex-shrink: 0; font-size: 11px; font-weight: 800; color: #FFB627; }
.plan-pause { flex: 1; font-size: 11px; color: #8a6e55; font-style: italic; }
.plan-select { width: 92px; flex-shrink: 0; margin-bottom: 0; padding: 8px 6px; font-size: 11px; }
.plan-input { flex: 1; margin-bottom: 0; padding: 8px 10px; font-size: 12px; }
.pool-list { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; max-height: 200px; overflow-y: auto; }
.pool-row { display: flex; align-items: center; gap: 8px; font-size: 12px; background: rgba(0,0,0,0.2); border-radius: 8px; padding: 6px 8px; }
.pool-cat { font-weight: 800; font-size: 10px; flex-shrink: 0; }
.pool-titre { flex: 1; color: #E6D4C0; }
.back-link { display: flex; align-items: center; gap: 4px; background: none; border: none; color: #C9A98A; font-size: 13px; font-weight: 700; padding: 4px 0; align-self: flex-start; }
.prep-item { border-top: 1px solid rgba(255,178,39,0.12); padding: 12px 0; }
.prep-item:first-child { border-top: none; padding-top: 4px; }
.prep-item-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.prep-item-name { font-size: 14px; font-weight: 700; color: #F2E8DC; }
.prep-item-target { font-size: 12px; font-weight: 800; color: #FFB627; }
.prep-contribs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.prep-contrib-chip { display: flex; align-items: center; gap: 5px; font-size: 11px; background: rgba(0,0,0,0.2); border-radius: 20px; padding: 4px 10px 4px 4px; color: #C9A98A; }
.prep-my-row { display: flex; align-items: center; gap: 8px; }
.prep-my-qty { flex: 1; font-size: 12px; color: #8a6e55; }
.log-list { display: flex; flex-direction: column; gap: 6px; max-height: 200px; overflow-y: auto; }
.log-row { font-size: 12px; color: #C9A98A; padding: 6px 8px; background: rgba(0,0,0,0.2); border-radius: 8px; }

.finale-banner { text-align: center; padding: 20px 0 4px; }
.finale-title { font-family: 'Arial Black', sans-serif; font-size: 26px; font-weight: 900; color: #FFB627; text-shadow: 0 0 30px rgba(255,107,53,0.5); }
.finale-sub { font-size: 13px; color: #C9A98A; margin-top: 4px; }
.champion-card { display: flex; flex-direction: column; align-items: center; padding: 24px; background: linear-gradient(155deg, rgba(255,178,39,0.15), rgba(255,107,53,0.05)); border: 1px solid rgba(255,178,39,0.3); border-radius: 20px; }
.champion-name { font-size: 22px; font-weight: 900; margin-top: 12px; color: #FFD9A8; }
.champion-points { font-size: 14px; color: #FFB627; font-weight: 700; margin-top: 4px; }

.tabbar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 5; display: flex; background: rgba(42,28,18,0.92); backdrop-filter: blur(10px); border-top: 1px solid rgba(255,107,53,0.2); padding: 8px 6px calc(8px + env(safe-area-inset-bottom)); max-width: 480px; margin: 0 auto; }
.tab-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; color: #8a6e55; font-size: 10px; font-weight: 700; padding: 6px 0; }
.tab-btn.active { color: #FF6B35; }

.loading-screen { flex: 1; display: flex; align-items: center; justify-content: center; height: 100vh; }
.spin { animation: spin 1.2s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
button:disabled { opacity: 0.4; cursor: not-allowed; }
input[type="checkbox"] { accent-color: #FF6B35; }
select.input { appearance: none; -webkit-appearance: none; }
a, button { cursor: pointer; }
</style>

function quadrupedBody(g) {
  return `
    <g transform="translate(38,108)">
      <rect x="18" y="40" width="9" height="16" rx="3" fill="#3A2410" />
      <rect x="70" y="42" width="9" height="16" rx="3" fill="#3A2410" />

      <rect x="88" y="38" width="9" height="18" rx="3" fill="#3A2410" />
    </g>`;
}

function svgWrap(uid, size, inner) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">${emblemChrome(uid)}${inner}</svg>`;
}

/* ===================== SONS (Web Audio API) ===================== */
function ringBell() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.28, 0.56].forEach((delay) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, ctx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + delay + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + delay + 0.5);
      osc.connect(gain).connect(ctx.destination);
      osc.start(ctx.currentTime + delay);
      osc.stop(ctx.currentTime + delay + 0.5);
    });
  } catch (e) {}
  try { if (navigator.vibrate) navigator.vibrate([250, 120, 250, 120, 500]); } catch (e) {}
}

function playFireCrackle() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const duration = 2.4;
    const bufferSize = Math.floor(ctx.sampleRate * duration);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      let amp = (Math.random() * 2 - 1) * 0.18;
      if (Math.random() < 0.0035) amp += (Math.random() * 2 - 1) * 0.9;
      data[i] = amp;
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.value = 1400;
    filter.Q.value = 0.6;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.7, ctx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.7, ctx.currentTime + duration - 0.5);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
    noise.connect(filter).connect(gain).connect(ctx.destination);
    noise.start();
    noise.stop(ctx.currentTime + duration);
  } catch (e) {}
  try { if (navigator.vibrate) navigator.vibrate([80, 40, 60, 40, 100]); } catch (e) {}
}

function playEpicFanfare() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    [0, 0.55, 1.0].forEach((t) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(95, now + t);
      osc.frequency.exponentialRampToValueAtTime(38, now + t + 0.35);
      gain.gain.setValueAtTime(0.0001, now + t);
      gain.gain.exponentialRampToValueAtTime(0.55, now + t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + t + 0.55);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now + t);
      osc.stop(now + t + 0.6);
    });
    const startT = now + 1.35;
    [130.81, 155.56, 196.0, 261.63].forEach((f) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sawtooth";
      osc.frequency.value = f;
      gain.gain.setValueAtTime(0.0001, startT);
      gain.gain.exponentialRampToValueAtTime(0.14, startT + 0.9);
      gain.gain.exponentialRampToValueAtTime(0.0001, startT + 2.8);
      osc.connect(gain).connect(ctx.destination);
      osc.start(startT);
      osc.stop(startT + 2.9);
    });
    const gongT = startT + 0.15;
    const gongOsc = ctx.createOscillator();
    const gongGain = ctx.createGain();
    gongOsc.type = "triangle";
    gongOsc.frequency.setValueAtTime(220, gongT);
    gongGain.gain.setValueAtTime(0.0001, gongT);
    gongGain.gain.exponentialRampToValueAtTime(0.45, gongT + 0.05);
    gongGain.gain.exponentialRampToValueAtTime(0.0001, gongT + 2.2);
    gongOsc.connect(gongGain).connect(ctx.destination);
    gongOsc.start(gongT);
    gongOsc.stop(gongT + 2.3);
  } catch (e) {}
  try { if (navigator.vibrate) navigator.vibrate([100, 80, 100, 80, 100, 150, 400]); } catch (e) {}
}

/* ===================== FIREBASE SYNC ===================== */
gameRef.on("value", (snap) => {
  const wasLoading = loading;
  state = snap.val() || emptyGameState();
  loading = false;

  if (prevLevel === null) prevLevel = state.level;
  if (prevStarted === null) prevStarted = state.started;
  if (prevFinished === null) prevFinished = state.finished;

  if (!wasLoading) {
    const isOrganizer = me && state.organizerId === me;
    if (state.started && !prevStarted) {
      playEpicFanfare();
      notifyBell("🔥 LES BBQ HUNGER GAMES COMMENCENT !", "24 heures. Que les réjouissances commencent !");
    } else if (state.level !== prevLevel && state.started && state.level !== 1) {
      ringBell();
      const epreuve = isOrganizer && state.currentEpreuve ? ` — ${state.currentEpreuve.titre}` : "";
      notifyBell(`🔔 Niveau ${state.level}/24 débloqué !`, isOrganizer ? `BBQ Hunger Games${epreuve}` : "BBQ Hunger Games — une nouvelle épreuve t'attend 🎁");
    }
    if (state.finished && !prevFinished) {
      ringBell();
      notifyBell("🏆 Fin des BBQ Hunger Games !", "Le champion est désigné — ouvre l'appli pour voir le podium.");
    }
  }
  prevLevel = state.level;
  prevStarted = state.started;
  prevFinished = state.finished;

  checkAutoBell();
  rerender();
});

/* Cloche automatique programmée : seul le téléphone de l'organisateur, appli ouverte, la déclenche */
let autoBellTimeout = null;
function checkAutoBell() {
  if (autoBellTimeout) { clearTimeout(autoBellTimeout); autoBellTimeout = null; }
  const isOrganizer = me && state.organizerId === me;
  if (!isOrganizer || !state.started || state.finished || !state.autoBell || !state.autoBell.enabled || !state.autoBell.nextAt) return;
  const msLeft = state.autoBell.nextAt - Date.now();
  autoBellTimeout = setTimeout(() => performAdvance(), Math.max(0, msLeft));
}

/* ===================== HELPERS ===================== */
function esc(str) {
  if (str === null || str === undefined) return "";
  return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function avatarHTML(avatarValue, size, ring) {
  const ringStyle = ring ? `box-shadow:0 0 0 2px ${ring};` : "";
  return `<div class="avatar" style="width:${size}px;height:${size}px;${ringStyle}overflow:hidden;">${avatarInner(avatarValue, size)}</div>`;
}
function alivePlayers() {
  return Object.values(state.players || {}).filter((p) => !p.eliminated);
}
function sortedPlayers(includeEliminated) {
  const alive = alivePlayers().sort((a, b) => b.points - a.points);
  if (!includeEliminated) return alive;
  const dead = Object.values(state.players || {}).filter((p) => p.eliminated).sort((a, b) => b.points - a.points);
  return [...alive, ...dead];
}

/* ===================== RENDER ROOT ===================== */
function rerender() {
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = (active && typeof active.selectionStart === "number") ? active.selectionStart : null;
  const selEnd = (active && typeof active.selectionEnd === "number") ? active.selectionEnd : null;

  renderApp();

  if (activeId) {
    const el = document.getElementById(activeId);
    if (el) {
      el.focus();
      if (selStart !== null && el.setSelectionRange) {
        try { el.setSelectionRange(selStart, selEnd); } catch (e) {}
      }
    }
  }
}

function emberFieldHTML() {
  let embers = "";
  for (let i = 0; i < 18; i++) {

    embers += `<div class="ember" style="left:${left}%;animation-delay:${delay}s;animation-duration:${dur}s;opacity:${op};"></div>`;
  }
  return `<div class="ember-field" aria-hidden="true">${embers}</div>`;

function handlePhotoUpload(inputEl) {
  const file = inputEl.files && inputEl.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const size = 200;
      const canvas = document.createElement("canvas");
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext("2d");
      // recadrage carré centré
      const minSide = Math.min(img.width, img.height);
      const sx = (img.width - minSide) / 2;
      const sy = (img.height - minSide) / 2;
      ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);
      local.onboardAvatar = canvas.toDataURL("image/jpeg", 0.8);
      rerender();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function doJoin() {

    points: 0, energie: 100, faim: 100, hydratation: 100,

  saveShared((prev) => ({

function renderPrep(isOrganizer) {

  const groupsHTML = grouped.map((g) => {
    const itemsHTML = g.items.map((item) => {
      const contribs = Object.entries(item.contributions || {});
      const total = contribs.reduce((s, [, q]) => s + q, 0);
      const myQty = (item.contributions && item.contributions[me]) || 0;
      const canRemove = isOrganizer || !PREP_RESTRICTED_CATS.includes(item.cat);

        ? `<div class="prep-item-target">${total}/${item.objectif} ${esc(item.unite || "")}</div>`
        : (total > 0 ? `<div class="prep-item-target">${total} ${esc(item.unite || "")}</div>` : "");
      const barHTML = item.objectif
        ? `<div class="pbar-track" style="margin-bottom:6px;"><div class="pbar-fill" style="width:${Math.min(100, (total / item.objectif) * 100)}%;background:${PREP_CATS[g.cat].color};"></div></div>`
        : "";
      const contribsHTML = contribs.length
        ? `<div class="prep-contribs">${contribs.map(([pid, qty]) => {
            const pl = state.players[pid];
            if (!pl) return "";
            return `<div class="prep-contrib-chip">${avatarHTML(pl.avatar, 18)} ${esc(pl.name)} · ${qty}${item.unite ? " " + esc(item.unite) : ""}</div>`;
          }).join("")}</div>`
        : "";
      return `<div class="prep-item">
        <div class="prep-item-head"><div class="prep-item-name">${esc(item.nom)}</div>${targetHTML}</div>
        ${barHTML}
        ${contribsHTML}
        <div class="prep-my-row">
          <button class="icon-btn" onclick="adjustPrepContribution('${item.id}',-1)" ${myQty === 0 ? "disabled" : ""}>−</button>
          <div class="prep-my-qty">${myQty > 0 ? `Tu apportes ${myQty}${item.unite ? " " + esc(item.unite) : ""}` : "Je n'apporte rien"}</div>
          <button class="icon-btn" onclick="adjustPrepContribution('${item.id}',1)">+</button>
          ${canRemove ? `<button class="btn-mini danger" onclick="removePrepItem('${item.id}')">Suppr.</button>` : ""}
        </div>
      </div>`;
    }).join("");
    return `<div class="card"><div class="section-title" style="color:${PREP_CATS[g.cat].color}">${PREP_CATS[g.cat].label}</div>${itemsHTML}</div>`;
  }).join("") || `<div class="card"><div class="empty-note">Aucun produit ajouté pour l'instant.</div></div>`;

  return `
    <div class="screen">
      <div class="section-title big">🍴 Préparation du BBQ</div>
      <div class="note" style="margin-top:-6px;">Chacun coche ce qu'il ramène et la quantité.</div>

        <select id="prepCatSel" class="input" onchange="local.prepCat=this.value">${catOptions}</select>
        <input id="prepNom" class="input" placeholder="Nom du produit (ex: Merguez, Charbon...)" value="${esc(local.prepNom)}" oninput="local.prepNom=this.value" />
        <div class="btn-row">
          <input id="prepObjectif" class="input" style="margin-top:0;" placeholder="Objectif (optionnel)" type="number" value="${esc(local.prepObjectif)}" oninput="local.prepObjectif=this.value" />
          <input id="prepUnite" class="input" style="margin-top:0;" placeholder="Unité (kg, packs...)" value="${esc(local.prepUnite)}" oninput="local.prepUnite=this.value" />
        </div>
        <button class="btn-primary" onclick="addPrepItem()">➕ Ajouter à la liste</button>

}

function addPrepItem() {
  const nom = local.prepNom.trim();
  if (!nom) return;
  const item = {
    id: "i_" + Math.random().toString(36).slice(2, 9),
    cat: local.prepCat, nom,
    objectif: local.prepObjectif ? Number(local.prepObjectif) : null,
    unite: local.prepUnite.trim(),
    contributions: {},
  };
  saveShared((prev) => ({ ...prev, shoppingList: [...(prev.shoppingList || []), item] }));
  local.prepNom = ""; local.prepObjectif = ""; local.prepUnite = "";
  rerender();
}
function removePrepItem(id) {
  saveShared((prev) => ({ ...prev, shoppingList: (prev.shoppingList || []).filter((i) => i.id !== id) }));
}
function adjustPrepContribution(id, delta) {
  saveShared((prev) => ({
    ...prev,
    shoppingList: (prev.shoppingList || []).map((i) => {
      if (i.id !== id) return i;
      const current = (i.contributions && i.contributions[me]) || 0;
      const next = Math.max(0, current + delta);
      const contributions = { ...(i.contributions || {}) };
      if (next === 0) delete contributions[me]; else contributions[me] = next;
      return { ...i, contributions };
    }),
  }));
}

      </div>

      <div class="card">
        <button class="btn-secondary" onclick="togglePlanner()">${ui.showPlanner ? "Fermer" : "Planifier les 24 niveaux à l'avance"}</button>
        ${ui.showPlanner ? `
          <div class="note" style="margin:8px 0;">Laisse un niveau vide pour le définir en direct pendant le jeu. La cloche appliquera automatiquement l'épreuve planifiée.</div>
          <div class="plan-list">${planListHTML}</div>
          <button class="btn-primary" onclick="savePlan()">✓ Enregistrer la planification</button>` : ""}
      </div>

      <div class="card">
        <div class="section-title">➕ Banque d'épreuves personnalisées</div>
        <div class="note" style="margin-bottom:8px;">Ajoute tes propres idées ; elles rejoignent le tirage aléatoire. Utilisable avant même le lancement, pour préparer tranquillement.</div>
        <select id="poolCatSel" class="input" onchange="local.poolCat=this.value">${poolCatOpts}</select>
        <input id="poolText" class="input" placeholder="Nom de l'épreuve" value="${esc(local.poolText)}" oninput="local.poolText=this.value" />
        <button class="btn-secondary" onclick="addToPool()">➕ Ajouter à la banque</button>
        ${poolListHTML ? `<div class="pool-list">${poolListHTML}</div>` : ""}
      </div>`;

  const midSections = (state.started && !state.finished) ? `
      <div class="card">
        <div class="section-title">Épreuve du niveau</div>
        <button class="btn-secondary" onclick="drawRandomEpreuve()">🔀 Tirer une épreuve aléatoire</button>
        <div class="field-label" style="margin-top:10px;">Ou définir manuellement</div>
        <select id="customCatSel" class="input" onchange="local.customCat=this.value">${customCatOpts}</select>
        <input id="customEpreuve" class="input" placeholder="Nom de l'épreuve" value="${esc(local.customEpreuve)}" oninput="local.customEpreuve=this.value" />
        <button class="btn-secondary" onclick="setEpreuveManual()">Lancer cette épreuve</button>
        ${winnerSelectHTML}
      </div>

      <div class="card">
        <div class="section-title">Carte événement</div>
        <button class="btn-secondary" onclick="drawCard()">🃏 Tirer une carte événement</button>
      </div>

      <div class="card">
        <div class="section-title">Bonus / pénalité manuelle</div>
        <div class="note" style="margin-bottom:8px;">Pour les missions secrètes, effets de cartes événements, ou toute exception hors barème.</div>
        <select id="pointsTargetSel" class="input" onchange="local.pointsTarget=this.value">${pointsTargetOpts}</select>
        <div class="points-row">
          <button class="icon-btn" onclick="changePointsAmount(-5)">−</button>
          <div class="points-amount">${local.pointsAmount} pts</div>
          <button class="icon-btn" onclick="changePointsAmount(5)">+</button>
        </div>
        <div class="btn-row">
          <button class="btn-secondary" onclick="givePoints(local.pointsAmount)">✓ Ajouter</button>
          <button class="btn-secondary danger" onclick="givePoints(-local.pointsAmount)">✕ Retirer</button>
        </div>
      </div>

      <div class="card">
        <div class="section-title">💀 Éliminer un joueur</div>
        ${elimRows || `<div class="empty-note">Aucun joueur.</div>`}
      </div>` : "";

  return `
    <div class="screen">
      <div class="section-title big">⚙️ Mode organisateur</div>
      <div class="card">
        <div class="section-title">Cloche & niveaux</div>
        ${bellSectionHTML}
      </div>
      ${autoBellHTML}
      ${prepSections}
      ${midSections}
      <div class="card"><button class="btn-secondary danger" onclick="resetGame()">Réinitialiser la partie</button></div>
      <div class="card"><div class="section-title">Journal</div><div class="log-list">${logHTML}</div></div>
    </div>`;
}

function togglePlanner() { ui.showPlanner = !ui.showPlanner; rerender(); }
function updatePlanRow(level, field, value) {
  const row = local.planRows.find((r) => r.level === level);
  if (row) row[field] = value;
}
function randomizePlanRow(level) {
  const row = local.planRows.find((r) => r.level === level);
  if (!row) return;
  const pool = getEpreuvePool(state, row.cat);
  row.titre = pool[Math.floor(Math.random() * pool.length)];
  rerender();
}
function savePlan() {
  saveShared((prev) => {
    const plannedEpreuves = {};
    local.planRows.forEach((r) => { if (r.titre && r.titre.trim()) plannedEpreuves[r.level] = { cat: r.cat, titre: r.titre.trim() }; });
    return { ...prev, plannedEpreuves, log: [{ t: Date.now(), msg: `📋 Planification des ${Object.keys(plannedEpreuves).length} niveaux enregistrée` }, ...(prev.log || [])] };
  });
}
function addToPool() {
  if (!local.poolText.trim()) return;
  const text = local.poolText.trim(), cat = local.poolCat;
  saveShared((prev) => {
    const epreuvePool = { ...(prev.epreuvePool || {}) };
    epreuvePool[cat] = [...(epreuvePool[cat] || []), text];
    return { ...prev, epreuvePool, log: [{ t: Date.now(), msg: `📚 Ajoutée à la banque (${CAT_LABELS[cat]}) : ${text}` }, ...(prev.log || [])] };
  });
  local.poolText = "";
  rerender();
}
function removeFromPool(cat, idx) {
  saveShared((prev) => {
    const epreuvePool = { ...(prev.epreuvePool || {}) };
    epreuvePool[cat] = (epreuvePool[cat] || []).filter((_, i) => i !== idx);
    return { ...prev, epreuvePool };
  });
}
function updateBareme(cat, value) {
  saveShared((prev) => ({ ...prev, pointsBareme: { ...(prev.pointsBareme || {}), [cat]: Number(value) || 0 } }));
}
function drawRandomEpreuve() {
  const cats = Object.keys(EPREUVES);
  const cat = cats[Math.floor(Math.random() * cats.length)];
  const pool = getEpreuvePool(state, cat);
  const titre = pool[Math.floor(Math.random() * pool.length)];
  saveShared((prev) => ({ ...prev, currentEpreuve: { cat, titre, resolved: false, winners: [] }, log: [{ t: Date.now(), msg: `🍖 Épreuve : ${titre} (${(prev.pointsBareme && prev.pointsBareme[cat]) ?? "?"} pts)` }, ...(prev.log || [])] }));
  local.selectedWinners = [];
}
function setEpreuveManual() {
  if (!local.customEpreuve.trim()) return;
  const titre = local.customEpreuve.trim(), cat = local.customCat;
  saveShared((prev) => ({ ...prev, currentEpreuve: { cat, titre, resolved: false, winners: [] }, log: [{ t: Date.now(), msg: `🍖 Épreuve : ${titre} (${(prev.pointsBareme && prev.pointsBareme[cat]) ?? "?"} pts)` }, ...(prev.log || [])] }));
  local.customEpreuve = "";
  local.selectedWinners = [];
  rerender();
}
function toggleWinner(id) {
  const i = local.selectedWinners.indexOf(id);
  if (i === -1) local.selectedWinners.push(id); else local.selectedWinners.splice(i, 1);
  rerender();
}
function validateEpreuve() {
  if (!state.currentEpreuve || local.selectedWinners.length === 0) return;
  const winners = [...local.selectedWinners];
  saveShared((prev) => {
    const cat = prev.currentEpreuve.cat;
    const pts = (prev.pointsBareme && prev.pointsBareme[cat]) || 0;
    const players = { ...prev.players };
    winners.forEach((wid) => {
      const p = players[wid];
      if (!p) return;
      players[wid] = { ...p, points: p.points + pts, epreuvesGagnees: (p.epreuvesGagnees || 0) + 1 };
    });
    const names = winners.map((wid) => players[wid] && players[wid].name).filter(Boolean).join(", ");
    return { ...prev, players, currentEpreuve: { ...prev.currentEpreuve, resolved: true, winners }, log: [{ t: Date.now(), msg: `🏆 ${names} remporte "${prev.currentEpreuve.titre}" (+${pts} pts chacun)` }, ...(prev.log || [])] };
  });
  local.selectedWinners = [];
}
function drawCard() {
  const c = CARTES[Math.floor(Math.random() * CARTES.length)];
  saveShared((prev) => ({ ...prev, currentCard: c, log: [{ t: Date.now(), msg: `🃏 Carte événement : ${c.titre}` }, ...(prev.log || [])] }));
}
function changePointsAmount(delta) {
  local.pointsAmount = Math.max(5, local.pointsAmount + delta);
  rerender();
}
function givePoints(delta) {
  if (!local.pointsTarget) return;
  const target = local.pointsTarget;
  saveShared((prev) => {
    const players = { ...prev.players };
    const p = players[target];
    if (!p) return prev;
    players[target] = { ...p, points: Math.max(0, p.points + delta) };
    return { ...prev, players, log: [{ t: Date.now(), msg: `${delta > 0 ? "➕" : "➖"} ${Math.abs(delta)} pts (bonus/pénalité manuelle) pour ${p.name}` }, ...(prev.log || [])] };
  });
}
function eliminatePlayer(id) {
  saveShared((prev) => {
    const players = { ...prev.players };
    const p = players[id];
    players[id] = { ...p, eliminated: true, eliminatedAt: prev.level };
    return { ...prev, players, log: [{ t: Date.now(), msg: `💀 ${p.name} est éliminé au niveau ${prev.level}` }, ...(prev.log || [])] };
  });
}
function startGame() {
  saveShared((prev) => {
    const planned = prev.plannedEpreuves ? prev.plannedEpreuves[1] : null;
    return {
      ...prev, started: true, startedAt: Date.now(), level: 1,
      currentEpreuve: planned ? { ...planned, resolved: false, winners: [] } : null,
      log: [
        { t: Date.now(), msg: "🔥 Le BBQ Hunger Games commence !" },
        ...(planned ? [{ t: Date.now(), msg: `🍖 Épreuve planifiée : ${planned.titre}` }] : []),
        ...(prev.log || []),
      ],
    };
  });
}
function performAdvance() {
  saveShared((prev) => {
    const nextLevel = Math.min(24, prev.level + 1);
    const pause = PAUSES.find((p) => p.at === nextLevel);
    const planned = prev.plannedEpreuves ? prev.plannedEpreuves[nextLevel] : null;
    const players = { ...prev.players };
    Object.values(players).forEach((p) => {
      if (!p.eliminated) {
        players[p.id] = { ...p, hydratation: Math.max(0, p.hydratation - 8), faim: Math.max(0, p.faim - 6), energie: Math.max(0, p.energie - 5) };
      }
    });
    const autoBell = prev.autoBell && prev.autoBell.enabled
      ? { ...prev.autoBell, nextAt: Date.now() + prev.autoBell.intervalMin * 60000 }
      : (prev.autoBell || { enabled: false, intervalMin: 60, nextAt: null });
    return {
      ...prev, level: nextLevel, players, finished: nextLevel >= 24,
      currentEpreuve: pause ? null : (planned || null), currentCard: null, autoBell,
      log: [
        { t: Date.now(), msg: pause ? `⏸️ ${pause.texte}` : `🔔 Niveau ${nextLevel} débloqué !` },
        ...(planned && !pause ? [{ t: Date.now(), msg: `🍖 Épreuve planifiée : ${planned.titre}` }] : []),
        ...(prev.log || []),
      ].slice(0, 40),
    };
  });
}
function endGame() {
  saveShared((prev) => {
    const allP = Object.values(prev.players || {}).sort((a, b) => b.points - a.points);
    const alive = allP.filter((p) => !p.eliminated);
    const players = { ...prev.players };
    if (alive[0]) players[alive[0].id] = { ...players[alive[0].id], badges: [...new Set([...(players[alive[0].id].badges || []), "champion", "survivant"])] };
    return { ...prev, finished: true, level: 24, players, log: [{ t: Date.now(), msg: "🏆 Fin des BBQ Hunger Games !" }, ...(prev.log || [])] };
  });
}
function toggleAutoBell(enabled, intervalMin) {
  saveShared((prev) => {
    const interval = intervalMin || (prev.autoBell && prev.autoBell.intervalMin) || 60;
    return {
      ...prev,
      autoBell: { enabled, intervalMin: interval, nextAt: enabled ? Date.now() + interval * 60000 : null },
      log: [{ t: Date.now(), msg: enabled ? `⏰ Cloche automatique activée (toutes les ${interval} min)` : "⏰ Cloche automatique désactivée" }, ...(prev.log || [])],
    };
  });
}
function resetGame() {
  if (!confirm("Réinitialiser complètement la partie (joueurs conservés, scores remis à zéro) ?")) return;
  saveShared((prev) => {
    const players = {};
    Object.values(prev.players || {}).forEach((p) => {
      players[p.id] = { ...p, points: 0, energie: 100, faim: 100, hydratation: 100, eliminated: false, eliminatedAt: null, badges: [], epreuvesGagnees: 0 };
    });
    return { ...emptyGameState(), organizerId: prev.organizerId, players };
  });
  local.planRows = null;
}

/* ===================== ÉCRAN: FINALE ===================== */
function renderFinale() {
  const ranked = sortedPlayers(true);
  const medals = ["🥇", "🥈", "🥉"];
  const champion = ranked[0];
  const rows = ranked.map((p, i) => `
    <div class="lb-row">
      <div class="lb-rank">${medals[i] || i + 1}</div>
      ${avatarHTML(p.avatar, 30)}
      <div class="lb-name">${esc(p.name)}${p.eliminated ? ` (éliminé H+${p.eliminatedAt})` : ""}</div>
      <div class="lb-points">${p.points} pts</div>
    </div>`).join("");

  return `
    <div class="screen">
      <div class="finale-banner">
        <div class="finale-title">FIN DES 24 HEURES</div>
        <div class="finale-sub">Champion BBQ Hunger Games</div>
      </div>
      ${champion ? `<div class="champion-card">
        ${avatarHTML(champion.avatar, 80, "#FFB627")}
        <div class="champion-name">👑 ${esc(champion.name)}</div>
        <div class="champion-points">${champion.points} points</div>
      </div>` : ""}
      <div class="card">${rows}</div>
    </div>`;
}

/* ===================== INIT ===================== */
renderApp();
</script>
</body>
</html>
